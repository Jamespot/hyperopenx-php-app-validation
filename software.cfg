[buildout]
extends =
  https://lab.nexedi.com/nexedi/slapos/raw/1.0.262/stack/slapos.cfg

parts = app-code instance-cfg

[app-code]
recipe = plone.recipe.command
command = mkdir -p ${buildout:parts-directory}/app && echo '<?php echo "Hello, SlapOS!";' > ${buildout:parts-directory}/app/index.php
stop-on-error = true

[instance-cfg]
recipe = slapos.recipe.build:download
url = https://raw.githubusercontent.com/Jamespot/hyperopenx-php-app-validation/main/instance.cfg.in
destination = ${buildout:directory}/instance.cfg

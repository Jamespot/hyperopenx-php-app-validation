[buildout]
extends =
  https://lab.nexedi.com/nexedi/slapos/raw/1.0.263/stack/slapos.cfg

parts =
  slapos-cookbook
  instance-cfg
  instance-php-cfg

[instance-cfg]
recipe = slapos.recipe.template:jinja2
url = https://raw.githubusercontent.com/Jamespot/hyperopenx-php-app-validation/v3/instance.cfg.in
output = ${buildout:directory}/instance.cfg
context =
  key instance_php instance-php-cfg:output

[instance-php-cfg]
recipe = slapos.recipe.template:jinja2
url = https://raw.githubusercontent.com/Jamespot/hyperopenx-php-app-validation/v3/instance-php.cfg.in
output = ${buildout:directory}/instance-php.cfg
context =
  section buildout buildout

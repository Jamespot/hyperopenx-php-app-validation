[buildout]
extends =
  https://lab.nexedi.com/nexedi/slapos/raw/1.0.432/component/openssl/buildout.cfg
  https://lab.nexedi.com/nexedi/slapos/raw/1.0.432/stack/slapos.cfg

parts =
  slapos-cookbook
  eggs
  instance-cfg

[python]
part = python3

[eggs]
recipe = zc.recipe.egg
eggs =
  plone.recipe.command
  collective.recipe.template

[instance-cfg]
recipe = slapos.recipe.template
url = https://raw.githubusercontent.com/Jamespot/hyperopenx-php-app-validation/v2/instance.cfg
output = ${buildout:directory}/instance.cfg

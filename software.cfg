[buildout]
parts = php app app-wrapper

extends =
  ../../component/php/buildout.cfg

[app]
recipe = hexagonit.recipe.download
url = https://example.com/mon-app-php.tar.gz
location = ${buildout:parts-directory}/app

[app-wrapper]
recipe = slapos.cookbook:wrapper
command-line = ${php:location}/bin/php -S 0.0.0.0:8080 -t ${app:location}
wrapper-path = ${buildout:parts-directory}/bin/run-php

[buildout]
extends =
  https://lab.nexedi.com/nexedi/slapos/raw/1.0.263/stack/slapos.cfg

parts =
  slapos-cookbook
  php-app-clone
  instance-cfg
  instance-php-cfg

[php-app-clone]
recipe = slapos.recipe.build
location = ${buildout:parts-directory}/php-app
init =
  import subprocess, os
  location = options['location']
  if not os.path.exists(location):
    env = dict(os.environ, GIT_SSH_COMMAND="ssh -i /opt/slapos/ssh/deploy-key -o StrictHostKeyChecking=accept-new")
    subprocess.check_call(['git', 'clone', '--depth', '1', '--branch', 'main',
      'git@github.com:Jamespot/hyperopenx-php-app.git', location], env=env)

[instance-php-cfg]
recipe = slapos.recipe.build:download
url = https://raw.githubusercontent.com/Jamespot/hyperopenx-php-app-validation/v4/instance-php.cfg.in
destination = ${buildout:directory}/instance-php.cfg

[instance-cfg]
recipe = slapos.recipe.template:jinja2
url = https://raw.githubusercontent.com/Jamespot/hyperopenx-php-app-validation/v4/instance.cfg.in
output = ${buildout:directory}/instance.cfg
context =
  raw instance_php ${buildout:directory}/instance-php.cfg
  raw php_app_dir ${php-app-clone:location}
